name: Verify Instagram Published Media

on:
  push:
    paths:
      - ".github/workflows/verify-instagram-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify latest published Instagram media
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: node scripts/verify_instagram_publish.mjs

      - name: Save verification details
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No verification changes to save."
            exit 0
          fi
          git config user.name "instagram-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "chore: save Instagram media verification"
          git push
