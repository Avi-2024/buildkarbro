name: Generate Daily Social Post

on:
  schedule:
    - cron: "0 2 * * *" # 07:30 IST
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional date to generate, format YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: social-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate fixed-calendar carousel and queue post
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
          TIMEZONE: Asia/Kolkata
          IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ secrets.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_SIZE: ${{ secrets.OPENAI_IMAGE_SIZE }}
          OPENAI_IMAGE_QUALITY: ${{ secrets.OPENAI_IMAGE_QUALITY }}
          REQUIRE_AI_IMAGE: ${{ secrets.REQUIRE_AI_IMAGE }}
        run: node scripts/generate_social_day.mjs

      - name: Save generated assets and queue
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated change to save."
            exit 0
          fi
          git config user.name "social-generator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json assets/daily
          git commit -m "chore: queue daily Build Kar Bro post"
          git push
