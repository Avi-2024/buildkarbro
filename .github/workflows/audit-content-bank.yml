name: Audit Content Bank

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-content-bank.yml"
      - "scripts/audit_content_bank.mjs"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Audit pushed carousel JPEG files
        run: node scripts/audit_content_bank.mjs
