name: Publish Social Queue

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-instagram.yml"
      - "scripts/social_queue.mjs"
      - "scripts/normalize_due_content_bank.mjs"
      - "scripts/preflight_instagram.mjs"
      - "scripts/publish_instagram.mjs"
      - "scripts/publish_social_queue.mjs"
      - "posts.json"
      - "assets/approved/**"
  schedule:
    # Try at 09:00 IST, then retry during the morning if GitHub delays a trigger.
    # Each run processes up to three unpublished due posts to clear missed days.
    - cron: "30,40,50 3 * * *" # 09:00, 09:10, 09:20 IST
    - cron: "0,10,20,30 4 * * *" # 09:30 through 10:00 IST
    - cron: "0,30 5 * * *" # 10:30 and 11:00 IST
    - cron: "30 9,12 * * *" # 15:00 and 18:00 IST recovery after a rate-limit cooldown
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-repo-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout queue
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Normalize original pushed carousel JPEGs
        run: node scripts/normalize_due_content_bank.mjs

      - name: Save normalized original assets
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Original pushed carousel assets already valid."
            exit 0
          fi
          git config user.name "social-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/content-bank
          git commit -m "chore: normalize pushed carousel JPEGs"
          git pull --rebase origin main
          git push

      - name: Check queue recovery behavior
        run: node --test tests/instagram_retry.test.mjs tests/social_queue_publish.test.mjs

      - name: Publish and verify up to three overdue posts
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || '1392360773951187' }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: node scripts/publish_social_queue.mjs

      - name: Save social publish status
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No queue status change to save."
            exit 0
          fi
          git config user.name "social-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "chore: save social publish status"
          git pull --rebase origin main
          git push
