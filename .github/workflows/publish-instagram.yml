name: Publish Social Queue

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout queue
        uses: actions/checkout@v6

      - name: Ensure approved Instagram JPEG assets exist
        run: |
          set -euo pipefail
          missing=0

          check_asset() {
            local file="$1"
            local min_bytes="$2"

            if [[ ! -s "$file" ]]; then
              echo "::error::Missing approved Instagram media: $file"
              missing=1
              return
            fi

            local bytes
            bytes="$(wc -c < "$file")"
            if (( bytes < min_bytes )); then
              echo "::error::$file is only ${bytes} bytes. This looks like fallback/placeholder media, not the approved premium 3D carousel. Upload the final premium JPEG first."
              missing=1
              return
            fi

            echo "$file OK (${bytes} bytes)."
          }

          check_asset assets/first-post.jpg 100000
          check_asset assets/carousel-2.jpg 100000
          check_asset assets/carousel-3.jpg 120000
          check_asset assets/carousel-4.jpg 80000
          check_asset assets/carousel-5.jpg 85000
          check_asset assets/carousel-6.jpg 90000

          if [[ "$missing" -ne 0 ]]; then
            echo "Approved carousel media is missing or still fallback. Upload the final premium JPEG assets before publishing."
            exit 1
          fi

          echo "All approved Instagram JPEG assets exist."

      - name: Preflight due Instagram post
        run: node scripts/preflight_instagram.mjs

      - name: Publish due Instagram post
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: node scripts/publish_instagram.mjs

      - name: Verify published Instagram media
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: node scripts/verify_instagram_publish.mjs

      - name: Publish verified post to Facebook Page
        env:
          FACEBOOK_PAGE_ID: "61594437443124"
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: node scripts/publish_facebook.mjs

      - name: Save social publish status
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No queue status change to save."
            exit 0
          fi
          git config user.name "social-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "chore: save social publish status"
          git push
