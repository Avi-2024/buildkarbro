name: Publish Instagram Queue

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout queue
        uses: actions/checkout@v6

      - name: Ensure approved Instagram JPEG assets exist
        run: |
          set -euo pipefail
          missing=0
          for f in first-post carousel-2 carousel-3 carousel-4 carousel-5 carousel-6; do
            if [[ ! -s "assets/$f.jpg" ]]; then
              echo "::error::Missing approved Instagram media: assets/$f.jpg"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Approved carousel media is missing. Upload the final premium JPEG assets before publishing."
            exit 1
          fi
          echo "All approved Instagram JPEG assets exist."

      - name: Preflight due post
        run: node scripts/preflight_instagram.mjs

      - name: Publish due post
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: node scripts/publish_instagram.mjs

      - name: Verify published media
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: node scripts/verify_instagram_publish.mjs

      - name: Save publish status
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No queue status change to save."
            exit 0
          fi
          git config user.name "instagram-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "chore: save Instagram publish verification"
          git push
