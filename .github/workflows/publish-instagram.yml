name: Publish Social Queue

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-instagram.yml"
      - "scripts/social_queue.mjs"
      - "scripts/normalize_due_content_bank.mjs"
      - "scripts/preflight_instagram.mjs"
      - "scripts/publish_instagram.mjs"
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-repo-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout queue
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Normalize original pushed carousel JPEGs
        run: node scripts/normalize_due_content_bank.mjs

      - name: Save normalized original assets
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Original pushed carousel assets already valid."
            exit 0
          fi
          git config user.name "social-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/content-bank
          git commit -m "chore: normalize pushed carousel JPEGs"
          git pull --rebase origin main
          git push

      - name: Preflight due Instagram post
        run: node scripts/preflight_instagram.mjs

      - name: Publish due Instagram post
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: node scripts/publish_instagram.mjs

      - name: Verify published Instagram media
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: node scripts/verify_instagram_publish.mjs

      - name: Publish verified post to Facebook Page
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || '1392360773951187' }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: node scripts/publish_facebook.mjs

      - name: Save social publish status
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No queue status change to save."
            exit 0
          fi
          git config user.name "social-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "chore: save social publish status"
          git pull --rebase origin main
          git push
