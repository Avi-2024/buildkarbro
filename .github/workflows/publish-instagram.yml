name: Publish Instagram Queue

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout queue
        uses: actions/checkout@v6

      - name: Preflight due post
        run: node scripts/preflight_instagram.mjs

      - name: Publish due post
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: node scripts/publish_instagram.mjs

      - name: Save publish status
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No queue status change to save."
            exit 0
          fi
          git config user.name "instagram-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "chore: mark Instagram post published"
          git push
