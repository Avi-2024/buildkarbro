name: Import Approved Carousel Assets

on:
  push:
    branches:
      - main
    paths:
      - ".upload-staging/READY"

permissions:
  contents: write

concurrency:
  group: assets-src-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Decode approved carousel assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets-src
          for n in 1 2 3 4 5 6; do
            cat .upload-staging/assets-src/slide-${n}.part-*.b64 | tr -d '\n\r ' | base64 -d > "assets-src/slide-${n}.webp"
            test -s "assets-src/slide-${n}.webp"
            file "assets-src/slide-${n}.webp" | grep -qi 'Web/P'
          done

      - name: Commit binary carousel assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upload-staging
          git config user.name "assets-import[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets-src .upload-staging
          git commit -m "assets: add approved 3D carousel to assets-src"
          git pull --rebase origin main
          git push
