name: Verify approved social batches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-30-day-social.yml"
      - "content/approved-*.json"
      - "scripts/verify_approved_batch.mjs"
      - "assets/approved/**"
      - "posts.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify the approved AI carousel batches
        run: |
          node scripts/verify_approved_batch.mjs content/approved-oct-23-29.json
          node scripts/verify_approved_batch.mjs content/approved-oct-30-nov-05.json
