name: Verify prepared 30-day social posts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-30-day-social.yml"
      - "content/approved-oct-23-29.json"
      - "scripts/verify_approved_batch.mjs"
      - "assets/approved/2026-10-2*/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify the seven prepared original AI carousels
        run: node scripts/verify_approved_batch.mjs
